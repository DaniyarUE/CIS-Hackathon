name: Two human approvals

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read

jobs:
  two-approvals:
    runs-on: ubuntu-latest
    steps:
      - name: Require 2 human approvals on the latest commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          approvers=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" --jq '.[]' | jq -rs \
            --arg author "$AUTHOR" --arg sha "$HEAD_SHA" '
              map(select(.user.type == "User" and .user.login != $author and .state != "COMMENTED"
                and (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR"))))
              | group_by(.user.login) | map(max_by(.submitted_at))
              | map(select(.state == "APPROVED" and .commit_id == $sha)) | map(.user.login) | .[]')
          count=$(printf '%s\n' "$approvers" | grep -c . || true)
          echo "Approvals from repo collaborators on $HEAD_SHA (excluding author $AUTHOR): $count"
          printf '%s\n' "$approvers"
          if [ "$count" -lt 2 ]; then
            echo "::error::This PR needs 2 human approvals on the latest commit before merge (has $count)."
            exit 1
          fi
