name: Night Watch

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Unit and attack tests
        run: python -m pytest -q
      - name: Night Watch code guard (AST)
        id: scan
        # run even if a test failed: a backdoor often breaks tests too, and we still want the report
        if: always() && github.event_name == 'pull_request'
        run: python -m nightwatch.scan --base "origin/${{ github.base_ref }}" --json nw.json --md nw.md
      - name: Post the guard report on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('nw.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('nw.md', 'utf8') + '\n\n---\n_Generated by Night Watch_';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - name: Hand the blocked PR to Devin
        # never on Devin's own PRs (no loops); secrets are not available to PRs from forks anyway
        if: always() && steps.scan.outcome == 'failure' && !startsWith(github.head_ref, 'devin/')
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python -m nightwatch.devin_ci nw.json
